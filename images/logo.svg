<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#primaryGrad)"/>
    <circle cx="60" cy="60" r="42" fill="white" opacity="0.12"/>
    
    <!-- Medical Cross -->
    <path d="M52 30h16v60h-16z" fill="white" opacity="0.25"/>
    <path d="M30 52h60v16h-60z" fill="white" opacity="0.25"/>
    
    <!-- Stylized 7 with heart and animal care symbol -->
    <path d="M38 38h44v10l-24 42h-13l21-38h-28v-14z" fill="white"/>
    
    <!-- Little Paw in the corner -->
    <ellipse cx="78" cy="40" rx="3.5" ry="4.5" fill="#fef08a" transform="rotate(15 78 40)"/>
    <ellipse cx="87" cy="44" rx="3" ry="4" fill="#fef08a" transform="rotate(25 87 44)"/>
    <ellipse cx="83" cy="52" rx="4" ry="4" fill="#fef08a"/>
  </g>
  
  <!-- Text Brand -->
  <text x="125" y="52" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="-0.5">NEW SEVEN</text>
  <text x="325" y="52" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#059669" letter-spacing="-0.5">PHARMA</text>
  
  <text x="126" y="78" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#2563eb" letter-spacing="1.5">VETERINARY &amp; PET CARE SPECIALIST</text>
  <text x="126" y="98" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-weight="500" font-size="13" fill="#64748b">गायी-म्हशी, कुत्रे-मांजरे व पोल्ट्री औषधांचे केंद्र • लालबाग, धुळे</text>
</svg>