<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" fill="none">
  <rect width="360" height="260" rx="16" fill="#F1F5F9"/>
  <!-- Floor Grid Base -->
  <path d="M40 180 L180 230 L320 180 L180 135 Z" fill="#E2E8F0"/>
  <!-- Rubber Mat 3D Slab -->
  <g transform="translate(180, 150)">
    <!-- Thickness edge -->
    <path d="M-130 -30 L0 15 L130 -30 L130 -10 L0 35 L-130 10 Z" fill="#1E293B"/>
    <!-- Top Face -->
    <path d="M-130 -30 L0 -75 L130 -30 L0 15 Z" fill="#334155"/>
    <!-- Diamond Anti-Skid Pattern Lines -->
    <path d="M-90 -45 L-20 -15 M-50 -60 L20 -30 M-10 -75 L60 -45 M30 -60 L100 -30" stroke="#475569" stroke-width="2"/>
    <path d="M-90 -15 L-20 -45 M-50 0 L20 -30 M-10 15 L60 -15 M30 0 L100 -30" stroke="#475569" stroke-width="2"/>
  </g>
  <!-- Spec Badge -->
  <rect x="22" y="20" width="130" height="28" rx="8" fill="#059669"/>
  <text x="87" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">22mm / 25mm RUBBER</text>
  <!-- Label -->
  <text x="180" y="240" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Heavy-Duty Diamond Grip Mat</text>
</svg>